name: 🔍 Drift Detection

on:
  push:
    branches: [main]
    paths:
      - 'k8s/**'
  workflow_dispatch:

jobs:
  detect-drift:
    name: 🔍 Detect Config Drift
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt

      - name: Detect Drift
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python3 scripts/detect_drift.py

      - name: Show Results
        run: |
          echo "## 🔍 Drift Results" >> $GITHUB_STEP_SUMMARY
          python3 -c "
import json
with open('drift-results.json') as f:
    d = json.load(f)
c = d['analysis']['combined']
j = d['analysis']['jaccard']
cos = d['analysis']['cosine']
print('| Metric | Score |')
print('|--------|-------|')
print(f'| Jaccard | {j[\"similarity_percentage\"]}% |')
print(f'| Cosine | {cos[\"similarity_percentage\"]}% |')
print(f'| Combined | {c[\"similarity_percentage\"]}% |')
print(f'| Level | **{c[\"drift_level\"]}** |')
print(f'| Drift | {c[\"overall_drift_percentage\"]}% |')
          " >> $GITHUB_STEP_SUMMARY

      - name: Commit Results
        run: |
          git config user.name "DriftLens Bot"
          git config user.email "driftlens@github-actions.com"
          git add drift-results.json
          git diff --staged --quiet || git commit -m "🤖 drift-results updated" && git push
