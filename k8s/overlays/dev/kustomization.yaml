apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: driftlens-dev

namePrefix: dev-

resources:
  - ../../base
  - configmap.yaml

patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: driftlens-deep-backend

commonLabels:
  environment: dev
