name: Drift Detection

on:
  push:
    branches: [main]
    paths:
      - 'k8s/**'
  workflow_dispatch:

jobs:
  detect-drift:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Detect Drift
        run: python3 scripts/detect_drift.py
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}

      - name: Commit Results
        run: |
          git config user.name "DriftLens Bot"
          git config user.email "driftlens@github-actions.com"
          git add drift-results.json
          git diff --staged --quiet || git commit -m "drift-results updated" && git push
