apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: driftlens-prod

namePrefix: prod-

resources:
  - ../../base
  - configmap.yaml

patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: driftlens-deep-backend

commonLabels:
  environment: prod
