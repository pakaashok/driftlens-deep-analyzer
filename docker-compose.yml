# DriftLens Deep Analyzer
# Usage: docker-compose up -d
# Dashboard: http://localhost:3001

services:
  backend:
    image: adeeashok/driftlens-deep-analyzer:latest
    container_name: driftlens-deep-backend
    ports:
      - "8001:8000"
    volumes:
      - ./samples:/app/samples:ro
      - ./drift-results.json:/app/drift-results.json:ro
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    image: adeeashok/driftlens-deep-frontend:latest
    container_name: driftlens-deep-frontend
    ports:
      - "3001:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: driftlens-deep-network
