services:
  backend:
    image: adeeashok/driftlens-deep-analyzer:latest
    container_name: driftlens-deep-backend
    ports:
      - "8001:8000"
    volumes:
      - ./samples:/app/samples:ro
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f",
             "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: adeeashok/driftlens-deep-frontend:latest
    container_name: driftlens-deep-frontend
    ports:
      - "3001:3000"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
    name: driftlens-deep-network
