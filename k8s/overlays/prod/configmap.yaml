apiVersion: v1
kind: ConfigMap
metadata:
  name: driftlens-deep-config
  namespace: driftlens-prod
  labels:
    app: driftlens-deep
    environment: prod
    managed-by: driftlens
    tier: critical
data:
  APP_ENV: production
  LOG_LEVEL: warn
  REPLICAS: "3"
  CACHE_ENABLED: "true"
  MAX_CONNECTIONS: "200"
  TIMEOUT: "120"
  VERSION: "1.0.0"
  DB_HOST: prod-db.internal
  ALERT_EMAIL: ops@company.com
  MONITORING_ENABLED: "true"
  NEW_FEATURE: "enabled"
  RATE_LIMIT: "500"
