apiVersion: v1
kind: ConfigMap
metadata:
  name: driftlens-deep-config
  namespace: driftlens-dev
  labels:
    app: driftlens-deep
    environment: dev
    managed-by: driftlens
data:
  APP_ENV: development
  LOG_LEVEL: debug
  REPLICAS: "1"
  CACHE_ENABLED: "false"
  MAX_CONNECTIONS: "10"
  TIMEOUT: "30"
  VERSION: "1.0.0"
  DB_HOST: dev-db.internal
  FEATURE_FLAG_A: "enabled"
  LOG_FORMAT: "json"
  SYNC_TEST: "true"
  BUILD_VERSION: "2.0.0"
